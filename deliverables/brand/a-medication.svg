<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" fill="none">
  <!-- Opening illustration: pharmacy envelope + morning dose slots. Flat, one accent color. -->
  <rect x="150" y="90" width="420" height="540" rx="28" fill="#ffffff" stroke="#e6e2db" stroke-width="2"/>
  <rect x="150" y="90" width="420" height="96" rx="28" fill="#b8325c"/>
  <rect x="150" y="150" width="420" height="36" fill="#b8325c"/>
  <text x="190" y="152" font-family="Pretendard" font-size="30" font-weight="800" fill="#ffffff">조제약</text>
  <text x="530" y="152" font-family="Pretendard" font-size="22" font-weight="500" fill="#f6e4ea" text-anchor="end">30일분</text>
  <g font-family="Pretendard" font-size="24" fill="#1c1a1f" font-weight="600">
    <text x="190" y="252">아모디핀정 5mg</text><text x="530" y="252" text-anchor="end" fill="#6b6670" font-weight="500">아침</text>
    <line x1="190" y1="276" x2="530" y2="276" stroke="#efece7" stroke-width="2"/>
    <text x="190" y="322">메트포르민 500mg</text><text x="530" y="322" text-anchor="end" fill="#6b6670" font-weight="500">아침 · 저녁</text>
    <line x1="190" y1="346" x2="530" y2="346" stroke="#efece7" stroke-width="2"/>
    <text x="190" y="392">아스피린프로텍트</text><text x="530" y="392" text-anchor="end" fill="#6b6670" font-weight="500">아침</text>
  </g>
  <text x="190" y="450" font-family="Pretendard" font-size="18" fill="#a19ca6">용법: 식후 30분 · 1일 1~2회</text>
  <g transform="translate(190 490)">
    <rect width="340" height="100" rx="18" fill="#f7f6f3" stroke="#e6e2db" stroke-width="2"/>
    <g font-family="Pretendard" font-size="18" fill="#6b6670" text-anchor="middle">
      <text x="57" y="86">월</text><text x="170" y="86">화</text><text x="283" y="86">수</text>
    </g>
    <circle cx="57" cy="42" r="20" fill="#1f8a6a"/><path d="M48 42l6 6 12-12" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="170" cy="42" r="20" fill="#1f8a6a"/><path d="M161 42l6 6 12-12" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="283" cy="42" r="19" fill="#ffffff" stroke="#b8325c" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="283" y="50" font-family="Pretendard" font-size="24" font-weight="800" fill="#b8325c" text-anchor="middle">?</text>
  </g>
</svg>
