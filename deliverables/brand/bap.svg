<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" width="720" height="720">
  <rect width="720" height="720" rx="48" fill="#f5f5f7"/>
  <g font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
    <!-- parent's repeated question -->
    <rect x="90" y="110" width="330" height="76" rx="38" fill="#e5e5ea"/>
    <text x="255" y="160" font-size="32" font-weight="600" fill="#1d1d1f" text-anchor="middle">밥은 먹었니?</text>
    <text x="440" y="160" font-size="22" fill="#8e8e93">×14</text>
    <!-- card for parents -->
    <rect x="150" y="240" width="420" height="300" rx="32" fill="#fff" stroke="#d2d2d7" stroke-width="2"/>
    <text x="190" y="305" font-size="26" fill="#8e8e93">21:05 · 민지</text>
    <text x="190" y="365" font-size="44" font-weight="700" fill="#1d1d1f">점심 먹었어요</text>
    <g font-size="26" font-weight="600">
      <rect x="190" y="400" width="104" height="52" rx="26" fill="#e7f6ec"/>
      <text x="242" y="435" fill="#1a7f37" text-anchor="middle">밥 ✓</text>
      <rect x="308" y="400" width="118" height="52" rx="26" fill="#e7f6ec"/>
      <text x="367" y="435" fill="#1a7f37" text-anchor="middle">귀가 ✓</text>
      <rect x="440" y="400" width="96" height="52" rx="26" fill="#fff4e5"/>
      <text x="488" y="435" fill="#b25e00" text-anchor="middle">△</text>
    </g>
    <circle cx="540" cy="250" r="34" fill="#e5484d"/>
    <text x="540" y="262" font-size="32" fill="#fff" text-anchor="middle">♥</text>
    <rect x="110" y="590" width="500" height="1" fill="#d2d2d7"/>
    <text x="360" y="645" font-size="30" font-weight="600" fill="#1d1d1f" text-anchor="middle">사진 한 장이면 엄마·아빠께 안부 끝</text>
  </g>
</svg>
