[project]
name = "kirothon"
version = "0.1.0"
description = "KIROTHON 2026 — AAcrew"
# .python-version 은 3.14 로 핀해 두지만, 하한은 느슨하게 둔다.
# 팀원 PC 에 3.12/3.13 만 있어도 당일 바로 돌 수 있어야 한다.
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "boto3>=1.35",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",      # FastAPI TestClient 가 요구한다
    "ruff>=0.6",
]

[tool.uv]
default-groups = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 레포 루트를 import 경로에 넣는다. backend 를 설치 가능한 패키지로 만들지 않고
# 그대로 import 하기 위한 것. (uvicorn 도 레포 루트에서 backend.main:app 으로 띄운다)
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # 한글 주석에서 줄 길이가 쉽게 넘는다
